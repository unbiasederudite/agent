[project]
name = "agent"
version = "0.1.0"
description = "A lightweight, extensible Python core for building AI agents"
readme = "README.md"
authors = [
    { name = "Mykhailo Stasiuk", email = "erudite1854@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "guardrails-ai>=0.11.0",
    "litellm>=1.96.2",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "pytest-asyncio>=1.4.0",
    "httpx2>=2.10.0",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "PT"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "litellm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "guardrails.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
